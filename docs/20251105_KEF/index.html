## KEF's Utility and Features

- AES-256 (ECB/CBC/CTR/GCM), commonly hw-accelerated.

- 12 versions: to fit many use-cases;

- minimalistic: biased towards constrained hardware.

- low-tech, simple implementation, far from bleeding-edge.

- KEF envelopes that hide same plaintext are not linkable.

- may offer plausible-deniability *or* might be fully self-documenting.

## KEF uses existing cryptographic primitives

### AES-256 + PBKDF2_HMAC + SHA256

- Advanced Encryption Standard **AES**
- Secure Hash Algorithm **SHA256**
- Password Based Key Derivation Function v2 **PBKDF2**
- Hash-based Message Authentication Code **HMAC**

**KEF treats primitives as a black-box:**

- user supplies: **password** + [**salt**],

- pbkdf2_hmac_sha256 **iterates** a sane-yet-variable number of times to stretch a 256-bit key,

- encrypt with AES-256 and mode-of-operation -- defined by the KEF **version**: result = ciphertext,

- include **auth** bytes [and others]: result = **cipher payload**,

- the **salt**, KEF **version**, **iterations**, and **cipher payload** are assembled into a minimalistic **KEF Envelope**.

???
READ-SLIDE-TOP-2-LINES!
In a nutshell: User supplies an encryption-key (must be strong) and an Id (should be unique) to encrypt.  Their key - as password and Id - as salt, are stretched to make a 256-bit AES key.  Plaintext is then encrypted, IV/Nonce and auth validation bytes are added as cipher payload, and everything is assembled into a minimalistic KEF envelope.

class: middle

## A KEF Envelope is:

#### a layout of bytes,
- *mostly* identifiable as KEF -- **if looking for it**,
- **without:** magic bytes, envelope length, checksum, or raison-d'être,
- by default, nothing about it screams "I am a KEF Envelope!".

#### Every KEF Envelope is composed of:
**Id** + **Version** + **Iterations** + **Cipher Payload**
- variable-length user-defined **Id** (as a name/label -- used as salt),
- 1-byte **Version** number (implies KEF rule-set),
- 3-byte PBKDF2 **Iterations** (for stretching the AES key),
- variable-length **Cipher Payload**.

**
If any bytestring has a valid *version* byte, and the rest of the envelope parses 
according to KEF's rules for that version, then it *might* be a KEF envelope.
**

### Only the owner knows for sure.

## Why so many KEF versions?

KEF wants to *play well with others*, offering choices to different projects, 
as well as choices to bitcoiners who use those projects.

**Not all platforms readily support the same AES modes-of-operation.**

- Electronic Code Book (ECB) *K210 hw-optimized*
- Cipher Block Chaining (CBC) *K210 hw-optimized*
- CounTeR mode (CTR) *added in MaixPy by Odudex - for not-yet-Kruxers*
- Galois Counter Mode (GCM) *k210 hw-optimized*

**Block modes ECB/CBC require padding; stream modes CTR/GCM do not**

- ECB and CBC each have versions with *unsafe* NUL padding AND *safe* PKCS#7 padding

** Uncompressed or Compressed versions for each mode**
- Since compression has parameters, a simple common compression scheme (same as BBQr)
  has been chosen to avoid unnecessary coordination between projects exchanging KEFs

???
Why so many KEF versions?  It's about playing well with others, so that KEF is attractive
for adoption by projects on different platforms.

ex) Krux didn't need CTR mode, the K210 already has 3 built-in hw-optimized AES 
modes-of-operation.  CTR was added for platforms and microcontrollers that may not have the 
same modes readily available.  This way, users of KEF can select modes common to the
projects they use.

Different KEF versions exist to support each AES mode-of-operation. For block-modes that
require padding, there are versions with safe and unsafe padding, and each mode has a version for compression.

### What does it mean for a project to adopt KEF?
Adoption means that KEF envelopes will be more recoverable into the future,
and that bitcoiners won't be *locked-in* to a particular signing device...

**Decrypt-Only Support per Version:**
- Supports **decrypt() only** for particular version(s).

**Full Support per Version:**
- Supports **encrypt() + decrypt()** for particular version(s).

**Full Support:**
- Supports **encrypt() + decrypt()** for all versions.<br />
  currently: Krux on K210, KruxMobileApp on android, Krux simulator on win/mac/*nix, and 3rdIteration's SeedSigner fork.

It's FOSS, projects are free to mix and match whichever versions they want to support; 
even to nudge *users* towards the versions they prefer.  No authority exists to issue **Certified KEF Support** badges.

Write the code and claim that you support KEF.  Others will open an *issue* or a *pull-request* if disputing a *claim* becomes necessary.

## KEF Implementation Gotchas

**If Duplicate plaintext blocks using mode ECB**
- BE STRICT, FAIL TO ENCRYPT!!!
- Select another Mode or ECB+compression which *may* result in plaintext without duplicate blocks.

**Versions with *unsafe* NUL-pad**
- BE STRICT, FAIL TO ENCRYPT!!!
  - If *auth* exposed and *plaintext* ends NUL (0x00)
  - If *auth* is hidden and *auth* ends NUL (0x00)
- Consider making a *reasonable* effort to successfully decrypt when it appears the above rules were broken.

**Truncated auth bytes**
- AES-ECB has 3-byte *auth*.  False decryption-success rate is 1:16M
- Most others have 4-byte *auth*.  False decryption-success rate is 1:4B
- Bug or Feature? Can grind alternate decryption keys that result in useless/wrong plaintext bytes.

## KEF Implementation Gotchas (continued)

**Falsely Identifying a bytestring as a KEF Envelope**

Textual data won't be confused as a KEF envelope since KEF versions use non-printable byte values.

Various bytestrings however, like binary PSBTs, will parse as a KEF envelope from time to time (2-3 per 100?).  Therefore, different strategies for how to ingest a KEF might be:

- **Explicitely as KEF**: Offer the choice for user to load a KEF envelope.

- **KEF in Priority**: try to parse as KEF first.  If not KEF or user declines to decrypt, treat original data in context.

- **Fallback to KEF**: try to parse data in context but if parsing fails, try as KEF.

**The user ALWAYS deserves to be presented with the KEF Envelope and offered a choice to decrypt.**

## KEF Implementation Gotchas (continued)

**Important Considerations Outside the Scope of KEF**

KEF envelopes, as a string of bytes, are parseable, often deniable, with no indication of *purpose*.

Implementations may consider wrapping KEF envelopes with *magic* bytes, a *purpose* and/or *length*, and a *checksum*, but it's *currently* out-of-scope for KEF).  Consider sharing ideas and embracing the ethos to *play well with others*.

Implementors will also need to consider encodings that make sense for storage and/or transport. While important, these decisions rest outside the scope of KEF.
- **binary**: most compact, not ideal for all QR scanners.
- **hex or HEX**: supported by all, available to small keypads, not compact.
- **base32**: widely supported, somewhat compact as QRs.
- **base43**: *(electrum)* same algo as base58; very compact for QRs; slow for large content.
- **base64**: supported by all, compact for json - not so compact for QRs.

Krux is biased to export base43 QRs, base64 to json, and binary to sdcard... but all-of-above are checked when ingesting and all are available via DatumTool.

???
Since KEF envelopes have no magic-bytes, envelope length, or checksum, feel free to wrap KEF in whatever is needed.  I'd just ask for implentations to share their thoughts and try to embrace playing well with others.

Certainly, each implentation will need to deal with encoding for transport and storage.
