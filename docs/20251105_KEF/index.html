# Plaintext Backups (BIP-39)

Pros:
### Minimal complexity: something you have + [ something you know ]
### Industry-wide support

Cons:
### Changes require complete setup/testing, on-chain activity
### Multiple backups may be a liability
### Transition from "securely-stored" to "in-use" may be a liability

# Encrypted Backups

Pros:
### Modify backups at any time w/o altering setup, w/o onchain activity
### Multiple backups; including ones only heirs/others can decrypt
### Plaintext secret revealed only on-device

Cons:
### Complexity, yet another "secret" to keep secure
### Weak-keys, poor implementation, unknowns

## The K stands for "KEF"

<hr>

...for encrypting BIP-39 mnemonics

...for encrypting variable length data

## KEF's Utility and Features

- AES-256 (ECB/CBC/CTR/GCM), commonly hw-optimized.

- 12 versions: to fit many use-cases;

- minimalistic: biased towards constrained hardware.

- low-tech, simple implementation, far from bleeding-edge.

- KEF envelopes hiding same plaintext not linkable.

- may be plausibly-deniable *or* may be fully-self-descriptive


---
class: middle

## KEF uses existing cryptographic primitives

### AES-256 + PBKDF2_HMAC + SHA256

- Advanced Encryption Standard **AES**
- Secure Hash Algorithm **SHA256**
- Password Based Key Derivation Function v2 **PBKDF2)**
- Hash-based Message Authentication Code **(HMAC)**

**KEF treats primitives as a black-box:**

- user supplies: **password** + [**salt**],

- pbkdf2_hmac_sha256 **iterates** a sane-yet-variable number of times to stretch a 256-bit key,

- encrypt with AES-256 and mode-of-operation -- defined by the KEF **version**: result = ciphertext,

- include **auth** bytes [and others]: result = **cipher payload**,

- the **salt**, KEF **version**, **iterations**, and **cipher payload** are assembled into a minimalistic **KEF Envelope**.
 

---
class: middle

## A KEF Envelope is:

#### a layout of bytes,
- *mostly* identifiable as KEF -- **if looking for it**,
- **without:** magic bytes, envelope length, checksum, or raison-d'être,
- by default, nothing about it screams "I am a KEF Envelope!".

#### Every KEF Envelope is composed of:
**Id** + **Version** + **Iterations** + **CipherPayLoad**
- variable-length user-defined **Id** (as a name/label -- used as salt),
- 1-byte **Version** number (implies KEF rule-set),
- 3-byte PBKDF2 **Iterations** (for stretching the AES key),
- variable-length **CipherPayLoad**.

**
If any bytestring has a valid *version* byte,
and the rest of the envelope parses according to KEF's rules for that version,
then it *might* be a KEF envelope.
**

### Only the owner knows for sure.

## Why so many KEF versions?


KEF wants to *play well with others*, offering choices to different projects, 
as well as choices to bitcoiners who use those different projects.

**Not all platforms readily support the same AES modes-of-operation.**

- Electronic Code Book (ECB) *K210 hw-optimized*
- Cipher Block Chaining (CBC) *K210 hw-optimized*
- CounTeR mode (CTR) *added in MaixPy by Odudex - for not-yet-Kruxers*
- Galois Counter Mode (GCM) *k210 hw-optimized*

**Block modes ECB/CBC require padding; stream modes CTR/GCM do not**

- ECB and CBC each have versions with *unsafe* NUL padding, and *safe* PKCS#7 padding

** Uncompressed or Compressed versions for each mode**
- Since compression has parameters, a simple common compression scheme (same as BBQr)
  has been chosen to avoid unnecessary coordination between projects exchanging KEFs


---
class: middle

#### Summary Table

| Ver# | Name       | Version Feature Notes          | Auth / Validation            |
|------|------------|--------------------------------|------------------------------|
| 0    | AES-ECB v1 | NUL-pad                        | SHA256(P)[:16]               |
| 1    | AES-CBC v1 | 16b IV, NUL-pad                | SHA256(P)[:16]               |
| 5    | AES-ECB    | NUL-pad                        | SHA256(v+P+k)[:3] Exposed    |
| 6    | AES-ECB +p | PKCS7-pad                      | SHA256(P)[:4]                | 
| 7    | AES-ECB +c | PKCS7-pad, compression         | SHA256(compressed(P))[:4]    |
| 10   | AES-CBC    | 16b IV, NUL-pad                | SHA256(v+iv+P+k)[:4] Exposed |
| 11   | AES-CBC +p | 16b IV, PKCS7-pad              | SHA256(P)[:4]                |
| 12   | AES-CBC +c | 16b IV, PKCS7, compression     | SHA256(compressed(P))[:4]    |
| 15   | AES-CTR    | 12b IV,                        | SHA256(P)[:4]                |
| 16   | AES-CTR +c | 12b IV, compression            | SHA256(compressed(P))[:4]    |
| 20   | AES-GCM    | 12b Nonce                      | GCM authtag[:4] Exposed      |
| 21   | AES-GCM +c | 12b Nonce, compression         | GCM authtag[:4] Exposed      |

Notes:
- besides versions 0,1, others are slotted by mode-of-operation (slots of 5)
- versions 32-126 likely never-to-be-used (conflict with printable ASCII)
- versions 253-255 likely reserved for future (ie: versions 253/254/255 might indicate reading the next 2/4/8 bytes as version rule-set bitmaps)

### What does it mean for a project to adopt KEF?
Adoption means that KEF envelopes will be more recoverable into the future,
and that bitcoiners won't be *locked-in* to a particular signing device...

**Full Support:**
- Implementation supports **decryption** AND **encryption** for all KEF versions (ie: Krux and 3rdIteration's SeedSigner fork)

**Complete Support per Version:**
- Implementation supports **decryption** AND **encryption** for a particular version

**Decrypt-Only Support per Version:**
- Implementation supports **decryption-only** for a particular version

It's FOSS, every project is free to mix and match whichever versions they want to support; even to nudge their *users*
towards the versions they prefer.  Nobody will issue **Certified KEF Support** badges, that entity doesn't exist.

Simply write the code and claim that you support KEF.  Myself and others will happily open an *issue* or a *pull-request* if disputing *claims* become necessary.

## KEF Implementation Gotchas

**Truncated auth bytes**
- AES-ECB has 3-byte *auth*.  false decryption-success 1:16M
- most others have 4-byte *auth*.  False decryption-success 1:4B
- Bug or Feature? can be used to grind alternate decryption keys that result in useless/wrong plaintext bytes.

**Duplicate plaintext blocks using mode ECB**
- FAIL TO ENCRYPT!!!
- select another Mode or ECB+compression which may result in plaintext without duplicate blocks

**Versions with *unsafe* NUL-pad**
- if *auth* exposed and *plaintext* ends NUL (0x00): FAIL TO ENCRYPT!
- if *auth* is hidden and *auth* ends NUL (0x00): FAIL TO ENCRYPT!
- Consider making a *reasonable* effort to successfully decrypt when it appears the above rules were broken.


---
class: middle

## KEF Implementation Gotchas (continued)

**Falsely Identifying a bytestring as a KEF Envelope**

Since no KEF versions use a version-byte which is printable ASCII, most textual data won't be confused as a KEF envelope.

Bytestrings however, like binary PSBTs, will parse as a KEF envelope from time to time.  Therefore, different strategies for how to ingest a KEF might be:

- **Explicitely as KEF**: Offer the choice for user to load a KEF envelope within a particular context. Present envelope with a choice to "Decrypt?"

- **KEF in Priority**: Try converting data to bytes, then try to parse as KEF. If KEF, present envelope with a choice to "Decrypt?".  If not KEF or if user declines, treat original data within context.

- **Fallback to KEF**: Use the data as plain within context, if parsing fails, try KEF and reparse in same context after plaintext is revealed.


---
class: middle

## KEF Implementation Gotchas (continued)

**Important Considerations Outside the Scope of KEF**

KEF is a string of bytes, parseable, sometimes plausibly deniable, without indication of *purpose*.
Implementors are free to consider wrapping KEF envelopes with *magic* bytes, *purpose* and/or *length* headers -- and a *checksum*, but it's outside the scope of KEF (currently).  Share ideas with Krux and other projects, embracing the ethos to "play well with others".

As well, implementors will need to consider encodings that make sense, also outside the scope of KEF.
- **binary**: compact but not great for all QR scanners
- **hex or HEX**: understood by all, available on small keypads, far from compact
- **base32**: available in many libs, somewhat compact as QRs
- **base43**: same algo as base58 w/ different alphabet... originally from *electrum*.  Very compact for QRs, but slow for large content
- **base64**: understood by all, compact for json - less compact for QRs
